[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesbuilding"
version = "0.1.0"
description = "Bayesian approach for building energy modeling"
readme = "README.md"
license = { file = "LICENCE.md" }
authors = [
    { name = "Nobatek/INEF4", email = "bdurandestebe@nobatek.inef4.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pymc>=6.0,<7",
    "arviz==1.2.0",
    "xarray>=2024.11.0",
    "pandas>=2.2.2",
    "numpy>=2.0.0",
    "matplotlib>=3.9.0",
    "plotly>=5.13.1",
    "seaborn>=0.13.2",
    "h5netcdf>=1.3.0",
    "h5py>=3.11.0",
]

[project.urls]
Homepage = "https://github.com/BuildingEnergySimulationTools/bayesbuilding"

[tool.setuptools.packages.find]
exclude = ["tests*"]
